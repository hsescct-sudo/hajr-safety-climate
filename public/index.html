<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HAJR Safety Climate Survey</title><meta name="app-version" content="10.3.0-final"><link rel="stylesheet" href="styles.css?v=10.3.0-final"></head><body>
<section id="languageView" class="language-page"><div class="language-wrap"><div id="languageLogos" class="logo-panel"></div><div class="hero"><div class="eyebrow" id="languageProject"></div><h1 id="languageTitle">Safety Climate Survey</h1><p class="lead">Choose your language • اختر اللغة • اپنی زبان منتخب کریں • अपनी भाषा चुनें</p></div><div id="languageGrid" class="language-grid"></div></div></section>
<header id="publicHeader" class="public-header hidden"><div class="header-inner"><div id="headerLogos" class="logo-strip"></div><div style="display:flex;align-items:center;gap:9px"><div id="headerProject" class="header-project"></div><button id="langButton" class="lang-switch" onclick="App.showLanguages()">Language</button></div></div></header>
<main id="homeView" class="container hidden"><section class="welcome"><div class="card"><div id="projectChip" class="project-chip"></div><h1 id="surveyName"></h1><p id="surveySubtitle" class="lead"></p></div><div class="card kpis"><div class="kpi"><b id="roleCount">4</b><span id="kpiQuestionnaires">Questionnaires</span></div><div class="kpi"><b id="languageCount">10</b><span id="kpiLanguages">Languages</span></div><div class="kpi"><b>8</b><span id="kpiFactors">Safety climate factors</span></div><div class="kpi"><b>100%</b><span id="kpiAnonymous">Anonymous survey</span></div></div></section><section style="margin-top:26px"><h2 id="selectRoleTitle"></h2><p id="selectRoleSub" class="lead" style="font-size:14px"></p><div id="roleGrid" class="role-grid"></div></section><div class="footer" id="footerProject"></div></main>
<main id="profileView" class="container hidden"><section class="card form-shell"><div class="eyebrow" id="step1"></div><h2 id="whereTitle"></h2><p id="privacyText" class="lead" style="font-size:14px"></p><div class="grid2"><div class="field"><label id="roleLabel"></label><input id="roleField" readonly></div><div class="field"><label id="divisionLabel"></label><select id="divisionField"></select></div><div class="field"><label id="areaLabel"></label><input id="areaField"></div></div><div class="nav-row"><button class="btn btn-secondary" id="backBtn" onclick="App.showHome()"></button><button class="btn btn-primary" id="startBtn" onclick="App.openSurvey()"></button></div></section></main>
<main id="surveyView" class="container hidden"><section class="card form-shell"><div class="survey-head"><div><div class="eyebrow" id="step2"></div><h2 id="surveyRole"></h2></div><span class="pill" id="questionCount"></span></div><p id="voicePrivacy" class="small"></p><form id="surveyForm"></form><div class="nav-row"><button type="button" class="btn btn-secondary" id="cancelBtn" onclick="App.showHome()"></button><button type="button" class="btn btn-primary" id="submitBtn" onclick="App.submit()"></button></div></section></main>
<main id="successView" class="container hidden"><section class="card form-shell success"><div class="success-badge">✓</div><h2 id="thanksTitle" style="margin-top:16px"></h2><p id="thanksSub" class="lead" style="font-size:14px"></p><button id="returnBtn" class="btn btn-primary" onclick="App.showHome()"></button></section></main>
<script src="defaults.js?v=10.3.0-final"></script><script src="core.js?v=10.3.0-final"></script><script src="cloud.js?v=10.3.0-final"></script><script src="public.js?v=10.3.0-final"></script></body></html>
