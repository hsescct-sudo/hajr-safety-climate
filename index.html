<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAJR Expansion Project | Safety Climate Survey</title>
<link rel="stylesheet" href="styles.css"></head>
<body>
<section id="languageView" class="language-page">
  <div class="language-wrap">
    <div id="languageLogos" class="logo-panel"></div>
    <div class="hero">
      <div class="eyebrow">70330 – HAJR Expansion Project</div>
      <h1>Safety Climate Survey</h1>
      <p class="lead">Choose your language • اختر اللغة • اپنی زبان منتخب کریں • अपनी भाषा चुनें</p>
    </div>
    <div id="languageGrid" class="language-grid"></div>
  </div>
</section>

<header id="publicHeader" class="public-header hidden"><div class="header-inner">
  <div class="logos" id="headerLogos"></div>
  <div style="display:flex;align-items:center;gap:10px"><div id="miniProject" class="project-mini"></div><button class="lang-switch" onclick="App.showLanguages()" id="languageButton">Language</button></div>
</div></header>

<main id="homeView" class="container hidden">
  <section class="welcome">
    <div class="card"><div class="project-chip" id="projectChip"></div><h1 id="surveyTitle" style="margin-top:16px"></h1><p id="surveySubtitle" class="lead"></p></div>
    <div class="card kpi-grid"><div class="kpi"><strong id="roleCount">4</strong><span>Questionnaires</span></div><div class="kpi"><strong id="languageCount">10</strong><span>Languages</span></div><div class="kpi"><strong>8</strong><span>Safety climate factors</span></div><div class="kpi"><strong>100%</strong><span>Anonymous survey</span></div></div>
  </section>
  <section style="margin-top:28px"><h2 id="selectRoleTitle"></h2><p id="selectRoleSub" class="lead" style="font-size:14px"></p><div class="role-grid" id="roleGrid"></div></section>
  <div class="footer">70330 – HAJR Expansion Project • Safety Climate Survey</div>
</main>

<main id="profileView" class="container hidden"><section class="card form-shell">
  <div class="eyebrow" id="step1"></div><h2 id="whereTitle"></h2><p id="privacyText" class="lead" style="font-size:14px"></p>
  <div class="grid2"><div class="field"><label id="roleLabel"></label><input id="roleField" readonly></div><div class="field"><label id="positionLabel"></label><select id="positionField"></select></div><div class="field"><label id="divisionLabel"></label><select id="divisionField"></select></div><div class="field"><label id="companyLabel"></label><input id="companyField"></div><div class="field"><label id="areaLabel"></label><input id="areaField"></div></div>
  <div class="nav-row"><button class="btn btn-secondary" id="backBtn" onclick="App.showHome()"></button><button class="btn btn-primary" id="startBtn" onclick="App.openSurvey()"></button></div>
</section></main>

<main id="surveyView" class="container hidden"><section class="card form-shell">
  <div class="survey-head"><div><div class="eyebrow" id="step2"></div><h2 id="surveyRole"></h2></div><span class="pill" id="questionCount"></span></div>
  <form id="surveyForm"></form>
  <div class="nav-row"><button type="button" class="btn btn-secondary" id="cancelBtn" onclick="App.showHome()"></button><button type="button" class="btn btn-primary" id="submitBtn" onclick="App.submit()"></button></div>
</section></main>

<main id="successView" class="container hidden"><section class="card form-shell success"><div class="success-badge">✓</div><h2 id="thanksTitle" style="margin-top:18px"></h2><p class="lead" id="thanksSub" style="font-size:15px"></p><button class="btn btn-primary" id="returnBtn" onclick="App.showHome()"></button></section></main>

<script src="defaults.js"></script><script src="cloud.js"></script><script src="public.js"></script>
</body></html>
